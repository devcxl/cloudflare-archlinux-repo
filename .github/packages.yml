# 监控的包列表
# 条目格式：{name, url, allowed-source-patterns?, patches?}
# url 支持 aur.archlinux.org 或 github.com 等任意 git 仓库地址
# allowed-source-patterns 可选，声明 PKGBUILD 中 source URL 允许的 glob 模式白名单
# 支持通配符 *（匹配任意字符）和 ?（匹配单个字符）
# patches 可选，构建前应用到克隆源码上的补丁文件路径列表（相对仓库根目录），
# 用于修复上游 PKGBUILD 在构建环境中的问题（如 7z 对 macOS 符号链接的报错）
packages:
  - name: openchamber
    url: https://aur.archlinux.org/openchamber.git
    allowed-source-patterns:
      - https://registry.npmjs.org/@openchamber/web/*
  - name: visual-studio-code-bin
    url: https://aur.archlinux.org/visual-studio-code-bin.git
    allowed-source-patterns:
      - https://update.code.visualstudio.com/*
  - name: opencode-desktop-bin
    url: https://aur.archlinux.org/opencode-desktop-bin.git
    allowed-source-patterns:
      - https://github.com/anomalyco/opencode/releases/download/*
      - https://raw.githubusercontent.com/anomalyco/opencode/*
  - name: opencode-bin
    url: https://aur.archlinux.org/opencode-bin.git
    allowed-source-patterns:
      - https://github.com/anomalyco/opencode/releases/download/*
  - name: openai-codex-desktop
    url: https://aur.archlinux.org/openai-codex-desktop.git
    allowed-source-patterns:
      - https://persistent.oaistatic.com/codex-app-prod/*
      - https://registry.npmjs.org/better-sqlite3/*
      - https://registry.npmjs.org/node-pty/*
  - name: openai-codex-bin
    url: https://aur.archlinux.org/openai-codex-bin.git
    allowed-source-patterns:
      - https://github.com/openai/codex/releases/download/*
  - name: hysteria-bin
    url: https://aur.archlinux.org/hysteria-bin.git
    allowed-source-patterns:
      - https://github.com/apernet/hysteria/releases/download/*
      - https://raw.githubusercontent.com/apernet/hysteria/*
  - name: localsend-bin
    url: https://aur.archlinux.org/localsend-bin.git
    allowed-source-patterns:
      - https://github.com/localsend/localsend/releases/download/*
  - name: codegraph-bin
    url: https://aur.archlinux.org/codegraph-bin.git
    allowed-source-patterns:
      - https://github.com/colbymchenry/codegraph/releases/download/*
      - https://raw.githubusercontent.com/colbymchenry/codegraph/*
  - name: navicat17-premium-zh-cn
    url: https://aur.archlinux.org/navicat17-premium-zh-cn.git
    allowed-source-patterns:
      - https://dn.navicat.com/download/*
  - name: feishu-bin
    url: https://aur.archlinux.org/feishu-bin.git
    allowed-source-patterns:
      - https://sf3-cn.feishucdn.com/obj/ee-appcenter/*
  - name: pi-coding-agent-bin
    url: https://aur.archlinux.org/pi-coding-agent-bin.git
    allowed-source-patterns:
      - https://github.com/earendil-works/pi/releases/download/*
      - https://raw.githubusercontent.com/earendil-works/pi/*
  - name: zcode-desktop-bin
    url: https://aur.archlinux.org/zcode-desktop-bin.git
    allowed-source-patterns:
      - https://cdn-zcode.z.ai/zcode/electron/releases/*
  - name: cloudflare-wrangler
    url: https://aur.archlinux.org/cloudflare-wrangler.git
    allowed-source-patterns:
      - https://registry.npmjs.org/wrangler/*
      - https://raw.githubusercontent.com/cloudflare/workers-sdk/*
  - name: agent-browser
    url: https://aur.archlinux.org/agent-browser.git
    allowed-source-patterns:
      - https://registry.npmjs.org/agent-browser/*
  - name: playwright-cli
    url: https://aur.archlinux.org/playwright-cli.git
    allowed-source-patterns:
      - https://registry.npmjs.org/@playwright/cli/*
  - name: hmcl-bin
    url: https://aur.archlinux.org/hmcl-bin.git
    allowed-source-patterns:
      - https://github.com/HMCL-dev/HMCL/releases/download/*
      - https://raw.githubusercontent.com/HMCL-dev/HMCL/*
  - name: maestro-bin
    url: https://aur.archlinux.org/maestro-bin.git
    allowed-source-patterns:
      - https://github.com/mobile-dev-inc/maestro/releases/download/*


