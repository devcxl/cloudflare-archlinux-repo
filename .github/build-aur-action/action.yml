name: '构建Arch包'
description: '通过archlinux的docker镜像构建包（支持AUR和Git源）'
branding:
  icon: user-check
  color: gray-dark
inputs:
  package-name:
    description: '包名'
    required: true
    default: 'localsend-bin'
  source-url:
    description: 'Git仓库URL'
    required: true
    default: 'https://aur.archlinux.org/localsend-bin.git'
  patches:
    description: '构建前应用到克隆源码的补丁路径列表（空格分隔，相对仓库根目录）'
    required: false
    default: ''
runs:
  using: 'docker'
  image: 'Dockerfile'
  args:
    - ${{ inputs.package-name }}
    - ${{ inputs.source-url }}
    - ${{ inputs.patches }}