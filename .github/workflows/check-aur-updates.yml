name: Check Package Updates

on:
  schedule:
    - cron: "0 */3 * * *"  # Every 3 hours
  workflow_dispatch:

permissions:
  # 仅需要 actions: write 触发下游 workflow；全程只读仓库，无需 contents: write
  actions: write
  contents: read

jobs:
  check-updates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Read packages list
        id: read-packages
        uses: ./.github/read-packages-action

      - uses: ./.github/check-aur-updates-action
        with:
          packages-json: ${{ steps.read-packages.outputs.packages-json }}
          aws-bucket: ${{ secrets.AWS_BUCKET }}
          aws-access-key-id: ${{ secrets.AWS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-endpoint: ${{ secrets.AWS_ENDPOINT }}
          gh-repository: ${{ github.repository }}
