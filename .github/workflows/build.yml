name: Build arch package

on:
  workflow_dispatch:
    inputs:
      package-name:
        description: "包名"
        required: true
        default: "localsend-bin"
      source-url:
        description: "Git 仓库 URL"
        required: true
        default: "https://aur.archlinux.org/localsend-bin.git"
      skip-audit:
        description: "跳过 PKGBUILD 安全审计（仅紧急情况使用）"
        required: false
        default: "false"

# 串行化所有构建：每次构建都对 R2 共享仓库数据库做“下载快照→重建→上传→清理”，
# 并发会导致数据库与包文件不一致（竞态），故强制排队、不取消进行中的构建。
concurrency:
  group: repo-db-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Validate inputs
        run: |
          NAME="${{ github.event.inputs.package-name }}"
          URL="${{ github.event.inputs.source-url }}"
          if [[ ! "$NAME" =~ ^[a-zA-Z0-9@_+][a-zA-Z0-9@._+-]*$ ]]; then
            echo "::error::非法 package-name: $NAME" >&2
            exit 1
          fi
          if [[ ! "$URL" =~ ^https://([^/]+\.)?(aur\.archlinux\.org|github\.com|gitlab\.com)/ ]]; then
            echo "::error::非法 source-url（仅允许 https 且 host 白名单）: $URL" >&2
            exit 1
          fi

      - name: Security audit PKGBUILD
        if: ${{ github.event.inputs.skip-audit != 'true' }}
        uses: ./.github/pkgbuild-audit-action
        with:
          source-url: ${{ github.event.inputs.source-url }}
          package-name: ${{ github.event.inputs.package-name }}

      - name: Resolve package patches
        id: resolve-patches
        run: |
          PATCHES=$(python3 - "${{ github.event.inputs.package-name }}" <<'EOF'
          import sys
          import yaml
          try:
              with open(".github/packages.yml") as f:
                  data = yaml.safe_load(f)
          except FileNotFoundError:
              data = {}
          name = sys.argv[1]
          patches = []
          for pkg in data.get("packages", []):
              if isinstance(pkg, dict) and pkg.get("name") == name:
                  patches = pkg.get("patches") or []
                  break
          print(" ".join(patches))
          EOF
          )
          echo "patches=$PATCHES" >> "$GITHUB_OUTPUT"
          echo "Package patches: ${PATCHES:-none}"

      - name: Build package
        uses: ./.github/build-aur-action
        with:
          package-name: ${{ github.event.inputs.package-name }}
          source-url: ${{ github.event.inputs.source-url }}
          patches: ${{ steps.resolve-patches.outputs.patches }}

      - name: Cache package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ github.event.inputs.package-name }}
          path: ./${{ github.event.inputs.package-name }}/*.pkg.tar.zst

      - name: Download existing packages from R2
        uses: ./.github/download-r2-action
        with:
          aws-bucket: ${{ secrets.AWS_BUCKET }}
          aws-access-key-id: ${{ secrets.AWS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-endpoint: ${{ secrets.AWS_ENDPOINT }}
          skip-package: ${{ github.event.inputs.package-name }}

      - name: Move new package into repo folder
        run: |
          find ./${{ github.event.inputs.package-name }} -name '*.pkg.tar.zst' -exec cp {} ./repo/ \;

      - name: Generate pacman repo database
        uses: ./.github/generator_database
        with:
          database: devcxl
          path: ./repo
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Upload to R2
        uses: ./.github/upload-r2-action
        with:
          aws-bucket: ${{ secrets.AWS_BUCKET }}
          aws-access-key-id: ${{ secrets.AWS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-endpoint: ${{ secrets.AWS_ENDPOINT }}
          source-dir: ./repo

      - name: Clean old package versions in R2
        uses: ./.github/clean-old-packages-action
        with:
          aws-bucket: ${{ secrets.AWS_BUCKET }}
          aws-access-key-id: ${{ secrets.AWS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-endpoint: ${{ secrets.AWS_ENDPOINT }}
