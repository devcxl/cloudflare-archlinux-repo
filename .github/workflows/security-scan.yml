name: Security Scan

on:
  workflow_dispatch:
    inputs:
      package-name:
        description: "包名"
        required: true
        type: string
      source-url:
        description: "Git 仓库 URL (AUR 或其他)"
        required: true
        type: string

permissions:
  id-token: write
  contents: read
  actions: write
  security-events: write

env:
  SOURCE_DIR: /tmp/aur-source

jobs:
  quick-gate:
    name: "Layer 1 — Quick Gate (Gitleaks + Semgrep)"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      status: ${{ job.status }}
    steps:
      - uses: actions/checkout@v4

      - name: Clone AUR source
        run: |
          git clone --depth 1 "${{ inputs.source-url }}" "${{ env.SOURCE_DIR }}"

      # gitleaks-action@v2 在非工作目录路径下对 results.sarif 处理有 bug
      # 改用 CLI 直调，更稳定可靠
      - name: Gitleaks — secret scan
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | sudo tar -xz -C /usr/local/bin gitleaks
          cd "${{ env.SOURCE_DIR }}"
          gitleaks detect --no-git --source=. --verbose --redact --exit-code 1

      - name: Semgrep — SAST scan
        uses: semgrep/semgrep-action@v1
        with:
          config: auto
          target: ${{ env.SOURCE_DIR }}
        continue-on-error: false

  ai-review:
    name: "Layer 2 — AI Deep Review (OpenCode)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      status: ${{ job.status }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Clone AUR source
        run: |
          git clone --depth 1 "${{ inputs.source-url }}" "${{ env.SOURCE_DIR }}"

      - name: Prepare source summary for AI
        id: source-summary
        run: |
          echo "### 源码文件列表" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          find "${{ env.SOURCE_DIR }}" -type f | head -100 >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

          FILES=$(find "${{ env.SOURCE_DIR }}" -type f \
            \( -name 'PKGBUILD' -o -name '*.install' -o -name '*.patch' \
               -o -name '*.sh' -o -name '*.service' -o -name '*.conf' -o -name '*.cfg' \) \
            | head -20)
          for f in $FILES; do
            echo "---" >> $GITHUB_STEP_SUMMARY
            echo "**$f**" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            wc -l "$f" | awk '{print $1 " lines"}' >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          done

      - name: OpenCode AI security review
        shell: bash
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          PKG_NAME: ${{ inputs.package-name }}
          SRC_DIR: ${{ env.SOURCE_DIR }}
        run: |
          if ! command -v opencode &>/dev/null; then
            curl -fsSL https://opencode.ai/install | bash
            export PATH="$HOME/.opencode/bin:$PATH"
          fi
          cat > /tmp/ai-prompt.txt <<AIPROMPT
          你是一名 Arch Linux 安全审查专家。请对以下 AUR 包的源码进行深度安全检查。

          包名: ${PKG_NAME}
          源码路径: ${SRC_DIR}

          ## 审查要求

          请逐个检查以下安全维度，对每个维度给出 PASS / WARN / FAIL 判定：

          ### 1. 源码完整性校验（Source Integrity）
          - PKGBUILD 中 \`source\` 数组的所有 URL 是否指向可信域名？
          - \`sha256sums\` / \`sha512sums\` / \`b2sums\` 是否完整覆盖所有 source 条目？
          - 是否存在 \`SKIP\` 跳过校验的条目？
          - 是否有通过 \`curl\`/\`wget\` 动态下载且不校验哈希的行为？

          ### 2. 构建脚本安全（Build Script Safety）
          - \`build()\`, \`prepare()\`, \`package()\`, \`install()\` 是否有危险模式？
          - \`curl ... | bash\`、\`eval\`、\`chmod 777\`、修改系统文件等

          ### 3. 依赖安全（Dependency Security）
          - \`depends\`/\`makedepends\` 是否合法？是否有废弃或可疑包？

          ### 4. 敏感信息泄露（Secret Leakage）
          - 是否有硬编码 API Key、Token、密码、私钥？

          ### 5. 已知漏洞模式（Known Vulnerability Patterns）
          - \`.patch\`、\`.service\` 等文件是否有安全问题？

          ### 6. 供应链风险（Supply Chain Risk）
          - source URL 是否可信？\`validpgpkeys\` 是否明确？

          ## 输出要求

          审查完成后，在你的回复末尾必须单独一行输出最终判定：
          > FINAL_VERDICT: PASS
          或
          > FINAL_VERDICT: FAIL

          判定规则：任一维度 FAIL → 最终 FAIL；有 WARN 但无 FAIL → 最终 PASS。
          AIPROMPT
          opencode run \
            --model "opencode-go/deepseek-v4-pro" \
            --prompt-file /tmp/ai-prompt.txt \
            > "$SRC_DIR-review-output.txt" 2>&1

      - name: Parse AI review verdict
        if: always()
        run: |
          OUTPUT="${{ env.SOURCE_DIR }}-review-output.txt"
          if [ ! -f "$OUTPUT" ]; then
            echo "❌ AI review output file not found — OpenCode CLI failed"
            exit 1
          fi
          if grep -q 'FINAL_VERDICT:\s*FAIL' "$OUTPUT"; then
            echo "❌ AI review found FAIL-level security issues"
            grep -B5 'FINAL_VERDICT' "$OUTPUT" | head -20
            exit 1
          fi
          if grep -q 'FINAL_VERDICT:\s*PASS' "$OUTPUT"; then
            echo "✅ AI review passed"
            exit 0
          fi
          echo "⚠️ No FINAL_VERDICT found in AI output — treating as PASS"
          exit 0

      - name: Upload AI review output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-review-report-${{ inputs.package-name }}
          path: ${{ env.SOURCE_DIR }}-review-output.txt

  dependency-scan:
    name: "Layer 3 — Dependency & File Scan (Trivy)"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      status: ${{ job.status }}
    steps:
      - uses: actions/checkout@v4
      - name: Clone AUR source
        run: git clone --depth 1 "${{ inputs.source-url }}" "${{ env.SOURCE_DIR }}"
      - name: Trivy — filesystem vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: ${{ env.SOURCE_DIR }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: 1
          ignore-unfixed: true

      - name: Upload Trivy SARIF results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy-fs

  trigger-build:
    name: "Trigger Build (all scans passed)"
    runs-on: ubuntu-latest
    needs: [quick-gate, ai-review, dependency-scan]
    if: success()
    steps:
      - name: Trigger build workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run build.yml \
            --repo "${{ github.repository }}" \
            --ref "${{ github.ref_name }}" \
            -f package-name="${{ inputs.package-name }}" \
            -f source-url="${{ inputs.source-url }}"
      - name: Summary
        run: |
          echo "## ✅ Security Scan Passed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **包名**: ${{ inputs.package-name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **源码**: ${{ inputs.source-url }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Layer 1 (Quick Gate)**: PASS" >> $GITHUB_STEP_SUMMARY
          echo "- **Layer 2 (AI Review)**: PASS" >> $GITHUB_STEP_SUMMARY
          echo "- **Layer 3 (Trivy Scan)**: PASS" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "已触发构建: \`build.yml\`" >> $GITHUB_STEP_SUMMARY
