name: Security Scan

on:
  workflow_dispatch:
    inputs:
      package-name:
        description: "包名"
        required: true
        type: string
      source-url:
        description: "Git 仓库 URL (AUR 或其他)"
        required: true
        type: string

permissions:
  contents: read
  actions: write
  security-events: write

env:
  SOURCE_DIR: ${{ github.workspace }}/aur-source

jobs:
  quick-gate:
    name: "Layer 1 — Quick Gate (Gitleaks + Semgrep)"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      status: ${{ job.status }}
    steps:
      - uses: actions/checkout@v6

      - name: Clone AUR source
        run: |
          bash .github/clone-source-with-retry.sh \
            "${{ inputs.source-url }}" "${{ env.SOURCE_DIR }}"

      - name: Security audit PKGBUILD
        uses: ./.github/pkgbuild-audit-action
        with:
          source-url: ${{ inputs.source-url }}
          package-name: ${{ inputs.package-name }}
          source-dir: ${{ env.SOURCE_DIR }}

      # gitleaks-action@v2 在非工作目录路径下对 results.sarif 处理有 bug
      # 改用 CLI 直调，更稳定可靠
      - name: Gitleaks — secret scan
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | sudo tar -xz -C /usr/local/bin gitleaks
          cd "${{ env.SOURCE_DIR }}"
          gitleaks detect --no-git --source=. --verbose --redact --exit-code 1

      - name: Semgrep — SAST scan
        uses: semgrep/semgrep-action@v1
        with:
          config: auto
          target: ${{ env.SOURCE_DIR }}
        continue-on-error: false

  ai-review:
    name: "Layer 2 — AI Deep Review (OpenCode)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    outputs:
      status: ${{ job.status }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Clone AUR source
        run: |
          bash .github/clone-source-with-retry.sh \
            "${{ inputs.source-url }}" "${{ env.SOURCE_DIR }}"

      - name: Prepare source summary for AI
        id: source-summary
        run: |
          echo "### 源码文件列表" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          find "${{ env.SOURCE_DIR }}" -type f | head -100 >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

          FILES=$(find "${{ env.SOURCE_DIR }}" -type f \
            \( -name 'PKGBUILD' -o -name '*.install' -o -name '*.patch' \
               -o -name '*.sh' -o -name '*.service' -o -name '*.conf' -o -name '*.cfg' \) \
            | head -20)
          for f in $FILES; do
            echo "---" >> $GITHUB_STEP_SUMMARY
            echo "**$f**" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            wc -l "$f" | awk '{print $1 " lines"}' >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          done

      # action 自行处理安装/缓存；报告写入 runner.temp（git 工作区外）保持工作区干净，
      # 不会触发 action 的自动 push/PR；未授予 pull-requests 权限作为双保险。
      - name: OpenCode AI security review
        uses: anomalyco/opencode/github@latest
        with:
          model: "opencode-go/deepseek-v4-pro"
          use_github_token: true
          prompt: |
            你是一名 Arch Linux 安全审查专家。请对以下 AUR 包的源码进行深度安全检查。

            包名: ${{ inputs.package-name }}
            源码路径: ${{ env.SOURCE_DIR }}

            ## 重要约束

            1. 这是只读安全审查任务，只读取源码文件，不修改仓库内任何文件，不创建分支、提交或 PR。
            2. 不要修改、创建或删除 git 工作区中的任何文件。
            3. 审查完成后，将完整的 Markdown 审查报告写入文件 `${{ runner.temp }}/ai-review-report.md`，并在报告末尾单独一行输出 FINAL_VERDICT 判定。

            ## 审查要求

            请逐个检查以下安全维度，对每个维度给出 PASS / WARN / FAIL 判定：

            ### 1. 源码完整性校验（Source Integrity）
            - PKGBUILD 中 `source` 数组的所有 URL 是否指向可信域名？
            - `sha256sums` / `sha512sums` / `b2sums` 是否完整覆盖所有 source 条目？
            - 是否存在 `SKIP` 跳过校验的条目？
            - 是否有通过 `curl`/`wget` 动态下载且不校验哈希的行为？

            ### 2. 构建脚本安全（Build Script Safety）
            - `build()`, `prepare()`, `package()`, `install()` 是否有危险模式？
            - `curl ... | bash`、`eval`、`chmod 777`、修改系统文件等

            ### 3. 依赖安全（Dependency Security）
            - `depends`/`makedepends` 是否合法？是否有废弃或可疑包？

            ### 4. 敏感信息泄露（Secret Leakage）
            - 是否有硬编码 API Key、Token、密码、私钥？

            ### 5. 已知漏洞模式（Known Vulnerability Patterns）
            - `.patch`、`.service` 等文件是否有安全问题？

            ### 6. 供应链风险（Supply Chain Risk）
            - source URL 是否可信？`validpgpkeys` 是否明确？

            ## 报告格式

            # AUR 安全审查报告

            **包名**: ${{ inputs.package-name }}
            **源码**: ${{ inputs.source-url }}
            **审查时间**: (当前时间)

            ## 审查结论

            **最终判定**: PASS / FAIL

            ## 详细结果

            | 维度 | 判定 | 说明 |
            |------|------|------|
            | 源码完整性校验 | PASS/WARN/FAIL | ... |
            | 构建脚本安全 | PASS/WARN/FAIL | ... |
            | 依赖安全 | PASS/WARN/FAIL | ... |
            | 敏感信息泄露 | PASS/WARN/FAIL | ... |
            | 已知漏洞模式 | PASS/WARN/FAIL | ... |
            | 供应链风险 | PASS/WARN/FAIL | ... |

            ## 发现的问题

            (如有 FAIL/WARN，逐条列出问题描述、位置、风险等级、建议修复方案)

            判定规则：任一维度 FAIL → 最终 FAIL；有 WARN 但无 FAIL → 最终 PASS。

            报告末尾必须单独一行输出最终判定：
            FINAL_VERDICT: PASS
            或
            FINAL_VERDICT: FAIL
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}

      - name: Upload AI review report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-review-report-${{ inputs.package-name }}
          path: ${{ runner.temp }}/ai-review-report.md

      - name: Report AI review result
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPORT_FILE="$RUNNER_TEMP/ai-review-report.md"
          if [ ! -f "$REPORT_FILE" ]; then
            echo "::error::AI 审查报告缺失，阻断构建"
            exit 1
          fi

          VERDICT="UNKNOWN"
          if grep -qE 'FINAL_VERDICT[：:][[:space:]]*FAIL' "$REPORT_FILE"; then
            VERDICT="FAIL"
          elif grep -qE 'FINAL_VERDICT[：:][[:space:]]*PASS' "$REPORT_FILE"; then
            VERDICT="PASS"
          fi
          echo "AI 审查判定: $VERDICT"

          if [ "$VERDICT" = "UNKNOWN" ]; then
            echo "::error::AI 审查结果无法识别，阻断构建"
            exit 1
          fi

          if [ "$VERDICT" = "FAIL" ]; then
            TITLE="[安全审查] ${{ inputs.package-name }} 发现安全问题"
            EXISTS=$(gh issue list --repo "${{ github.repository }}" --state open \
              --limit 100 --json title \
              --jq ".[] | select(.title == \"$TITLE\") | .number" | head -1)
            if [ -n "$EXISTS" ]; then
              echo "已存在相同标题的 open Issue (#$EXISTS)，跳过创建"
            else
              gh issue create --repo "${{ github.repository }}" \
                --title "$TITLE" \
                --body-file "$REPORT_FILE"
            fi
            echo "❌ AI 审查未通过，阻断构建"
            exit 1
          fi

          echo "✅ AI 审查通过，继续构建"

  dependency-scan:
    name: "Layer 3 — Dependency & File Scan (Trivy)"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      status: ${{ job.status }}
    steps:
      - uses: actions/checkout@v6
      - name: Clone AUR source
        run: |
          bash .github/clone-source-with-retry.sh \
            "${{ inputs.source-url }}" "${{ env.SOURCE_DIR }}"
      - name: Trivy — filesystem vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: ${{ env.SOURCE_DIR }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: 1
          ignore-unfixed: true

      - name: Upload Trivy SARIF results
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy-fs

  trigger-build:
    name: "Trigger Build (all scans passed)"
    runs-on: ubuntu-latest
    needs: [quick-gate, ai-review, dependency-scan]
    if: success()
    steps:
      - name: Trigger build workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run build.yml \
            --repo "${{ github.repository }}" \
            --ref "${{ github.ref_name }}" \
            -f package-name="${{ inputs.package-name }}" \
            -f source-url="${{ inputs.source-url }}"
      - name: Summary
        run: |
          echo "## ✅ Security Scan Passed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **包名**: ${{ inputs.package-name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **源码**: ${{ inputs.source-url }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Layer 1 (Quick Gate)**: PASS" >> $GITHUB_STEP_SUMMARY
          echo "- **Layer 2 (AI Review)**: PASS" >> $GITHUB_STEP_SUMMARY
          echo "- **Layer 3 (Trivy Scan)**: PASS" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "已触发构建: \`build.yml\`" >> $GITHUB_STEP_SUMMARY
