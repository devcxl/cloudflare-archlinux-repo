name: Security Scan

on:
  workflow_dispatch:
    inputs:
      package-name:
        description: "包名"
        required: true
        type: string
      source-url:
        description: "Git 仓库 URL (AUR 或其他)"
        required: true
        type: string

permissions:
  contents: read
  actions: write
  security-events: write

env:
  SOURCE_DIR: /tmp/aur-source

jobs:
  quick-gate:
    name: "Layer 1 — Quick Gate (Gitleaks + Semgrep)"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      status: ${{ job.status }}
    steps:
      - uses: actions/checkout@v4
      - name: Clone AUR source
        run: git clone --depth 1 "${{ inputs.source-url }}" "${{ env.SOURCE_DIR }}"
      - name: Placeholder
        run: echo "TODO: T2 will add Gitleaks + Semgrep scanning logic here"

  ai-review:
    name: "Layer 2 — AI Deep Review (OpenCode)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      status: ${{ job.status }}
    steps:
      - uses: actions/checkout@v4
      - name: Clone AUR source
        run: git clone --depth 1 "${{ inputs.source-url }}" "${{ env.SOURCE_DIR }}"
      - name: Placeholder
        run: echo "TODO: T5 will add OpenCode AI review logic here"

  dependency-scan:
    name: "Layer 3 — Dependency & File Scan (Trivy)"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      status: ${{ job.status }}
    steps:
      - uses: actions/checkout@v4
      - name: Clone AUR source
        run: git clone --depth 1 "${{ inputs.source-url }}" "${{ env.SOURCE_DIR }}"
      - name: Placeholder
        run: echo "TODO: T4 will add Trivy scan logic here"

  trigger-build:
    name: "Trigger Build (all scans passed)"
    runs-on: ubuntu-latest
    needs: [quick-gate, ai-review, dependency-scan]
    if: success()
    steps:
      - name: Trigger build workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run build.yml \
            --repo "${{ github.repository }}" \
            --ref "${{ github.ref_name }}" \
            -f package-name="${{ inputs.package-name }}" \
            -f source-url="${{ inputs.source-url }}"
      - name: Summary
        run: |
          echo "## ✅ Security Scan Passed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **包名**: ${{ inputs.package-name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **源码**: ${{ inputs.source-url }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Layer 1 (Quick Gate)**: PASS" >> $GITHUB_STEP_SUMMARY
          echo "- **Layer 2 (AI Review)**: PASS" >> $GITHUB_STEP_SUMMARY
          echo "- **Layer 3 (Trivy Scan)**: PASS" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "已触发构建: \`build.yml\`" >> $GITHUB_STEP_SUMMARY
