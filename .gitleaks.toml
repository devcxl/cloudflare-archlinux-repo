# Gitleaks configuration for cloudflare-archlinux-repo
# 基于默认规则扩展 AUR/PKGBUILD 场景检测

title = "cloudflare-archlinux-repo Gitleaks 配置"

[extend]
useDefault = true

# ============================================================
# 自定义规则
# ============================================================

# PKGBUILD 凭证变量检测
# 检测 _token=, _secret=, _key=, _password=, _api_key= 等变量赋值
[[rules]]
id = "pkgbuild-token-variable"
description = "PKGBUILD 中的凭证变量赋值"
regex = '''(?im)^\s*(_token|_secret|_key|_password|_api_key|_passphrase|_credentials|_access_token|_auth_token)\s*=\s*['"]\S+['"]'''
tags = ["pkgbuild", "credentials"]
[rule.allowlist]
stopwords = [
    "dummy",
    "example",
    "placeholder",
    "test-only",
    "your-token-here",
]

# PGP 私钥块检测
[[rules]]
id = "pgp-private-key"
description = "PGP 私钥块"
regex = '''-----BEGIN PGP PRIVATE KEY BLOCK-----'''
tags = ["key", "pgp"]

# SSH 私钥检测
[[rules]]
id = "ssh-private-key"
description = "SSH 私钥"
regex = '''-----BEGIN (OPENSSH|RSA|DSA|EC|ENCRYPTED) PRIVATE KEY-----'''
tags = ["key", "ssh"]

# GitHub Personal Access Token
# 匹配 ghp_*, gho_*, ghu_*, ghs_*, ghr_* 前缀
[[rules]]
id = "github-token"
description = "GitHub Personal Access Token"
regex = '''\bgh[pousr]_[A-Za-z0-9_]{36,}\b'''
tags = ["credentials", "github"]

# GitLab Personal Access Token
[[rules]]
id = "gitlab-token"
description = "GitLab Personal Access Token"
regex = '''\bglpat-[A-Za-z0-9_\-]{20,}\b'''
tags = ["credentials", "gitlab"]

# GitLab Runner Registration Token
[[rules]]
id = "gitlab-runner-token"
description = "GitLab Runner Registration Token"
regex = '''\bGR1348941[A-Za-z0-9_\-]{20,}\b'''
tags = ["credentials", "gitlab"]

# Cloudflare API Token
[[rules]]
id = "cloudflare-api-token"
description = "Cloudflare API Token"
regex = '''\b[A-Za-z0-9_-]{40}\b'''
tags = ["credentials", "cloudflare"]
[rule.allowlist]
regexes = [
    # 排除常见 sha256 hash 误报（正则太长且可能匹配到正常内容，通过 path 辅助过滤）
]

# Cloudflare Global API Key（hex string pattern）
[[rules]]
id = "cloudflare-global-api-key"
description = "Cloudflare Global API Key"
regex = '''(?i)(CF_API_KEY|X-Auth-Key|X-Auth-Email)\s*[:=]\s*['"][0-9a-f]{37}['"]'''
tags = ["credentials", "cloudflare"]

# 通用 API Key / Secret Key 赋值
[[rules]]
id = "generic-api-key"
description = "通用 API Key 或 Secret Key 赋值"
regex = '''(?im)^\s*(api[_-]?key|apikey|secret[_-]?key|client[_-]?secret)\s*[:=]\s*['"][A-Za-z0-9+/=]{20,}['"]'''
tags = ["credentials", "api"]
[rule.allowlist]
stopwords = [
    "your-api-key",
    "your-secret-key",
    "replace-me",
]

# URL 中嵌入的凭证（https://user:password@host）
[[rules]]
id = "url-embedded-credentials"
description = "URL 中嵌入的凭证"
regex = '''https?://[^:@/\s]{1,128}:[^@/\s]{1,128}@'''
tags = ["credentials", "url"]

# AUR 私有包名泄露检测（作为潜在凭证模式的补充）
# 匹配格式：_pkgname=org-private-xxx 或 pkgname=internal-service-name
[[rules]]
id = "aur-private-pkgname"
description = "AUR/PKGBUILD 中潜在的私有包名"
regex = '''(?im)^\s*_pkgname\s*=\s*['"](internal|private|secret|proprietary|confidential)['"]'''
tags = ["pkgbuild", "aur"]
[rule.allowlist]
stopwords = []

# ============================================================
# 全局 Allowlist
# ============================================================

[allowlist]
description = "全局 Allowlist — 预留，后续根据扫描结果添加排除项"
paths = []
regexes = []
